# Sistema 3 (FR20 + modo BTC + cortos Aberration) en KuCoin. Correr los comandos desde esta carpeta.
services:
  sistema3:
    build:
      context: ..
      dockerfile: servidor/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./datos:/app/datos
      - ../config/sistema3.yaml:/app/config/sistema3.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"     # sólo local; desde afuera se entra por Caddy (HTTPS)
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  balas10:
    # 30 balas 10x en XBTUSDM (futuro inverso, margen aislado). Misma cuenta y claves que sistema3; sólo usa BTC de futuros.
    build:
      context: ..
      dockerfile: servidor/Dockerfile
    command: ["python", "-m", "balas10.principal"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./datos:/app/datos
      - ../config/balas10.yaml:/app/config/balas10.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/salud',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on: [sistema3]
