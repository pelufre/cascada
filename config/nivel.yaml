# Configuración de Cascada. Después de cambiar algo: docker compose restart cascada
modo: papel                  # papel | real   (empezar SIEMPRE en papel ~4 semanas)
nivel: nivel_30             # nivel_10 | nivel_20 | nivel_25 | nivel_30: pesos validados (p95 de caída 2020–23 ≈ el número)
capital_papel: 3000          # USDT simulados en modo papel (se reparte entre cuenta principal y 30 balas)

# Estrategias apagadas (su capital no se reparte). Ninguna: la validación con 3000 USDT y contratos reales las incluye.
desactivadas: []

# Riesgo. Caída desde el máximo que avisa y que cierra todo. Corte ≈ p95 de caída de 2020–23 del nivel (29,6 % en el 30).
alerta_caida: 0.20
corte_caida: 0.30
tope_nocional: 1.0           # nocional total ≤ 1 × patrimonio
apalancamiento_exchange: 3   # sólo el margen que KuCoin reserva por posición; el riesgo lo fija tope_nocional

# 30 balas en modo real: requiere la subcuenta con sus claves en .env. Mientras sea false, en real no opera.
balas_real: false
capital_balas_real: 0        # USD depositados en la subcuenta de balas al arrancar
# Iguala la subcuenta a peso × patrimonio total entre campañas (como la validación). Requiere KUCOIN_BALAS_UID y el
# permiso «FlexTransfers» en la clave de la principal. Probar antes: cli transferencia-prueba 15
balas_transferir: false

# X (Twitter): publica cada ciclo con operaciones (un post) y un resumen diario. X cobra por post.
x_publicar: false
x_operaciones: true
x_resumen_diario: true
x_max_dia: 12
